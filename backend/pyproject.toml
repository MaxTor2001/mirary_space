description = "Mirari — бэкенд интернет-магазина товаров для пирсинга"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1",
    "djangorestframework>=3.18",
    "django-cors-headers>=4.9",
    "django-filter>=25.2",
    "psycopg[binary]>=3.2",
    "pillow>=11.3",
    "gunicorn>=23.0",
    "whitenoise>=6.11",
    "python-slugify>=8.0.4",
    "yookassa>=3.12.1",
]
