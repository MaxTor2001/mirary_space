services:
  db:
    image: postgres:18-alpine
    container_name: mirari-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mirari}
      POSTGRES_USER: ${POSTGRES_USER:-mirari}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mirari}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT_HOST:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mirari} -d ${POSTGRES_DB:-mirari}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: mirari-backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      POSTGRES_DB: ${POSTGRES_DB:-mirari}
      POSTGRES_USER: ${POSTGRES_USER:-mirari}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mirari}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      SEED_DEMO: ${SEED_DEMO:-1}
      SHOP_LEGAL_NAME: ${SHOP_LEGAL_NAME:-ИП Канищева Екатерина Владимировна}
      SHOP_INN: ${SHOP_INN:-745110010453}
    volumes:
      - media:/app/media
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: mirari-frontend
    environment:
      API_URL: http://backend:8000/api
      SESSION_SECRET: ${SESSION_SECRET:-mirari-dev-secret}
      PORT: 3000
      SITE_URL: ${SITE_URL:-https://mirari.space}
      YANDEX_METRIKA_ID: ${YANDEX_METRIKA_ID:-}
      YANDEX_VERIFICATION: ${YANDEX_VERIFICATION:-}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  media:
