<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="320" height="380" role="img" aria-label="Золотое кольцо-кликер, освещающее темноту">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#f3d79a" stop-opacity="0.55"/>
      <stop offset="38%" stop-color="#c8a96a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0e0f12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="18%" y1="4%" x2="84%" y2="96%">
      <stop offset="0%" stop-color="#fbeec4"/>
      <stop offset="30%" stop-color="#e3c47f"/>
      <stop offset="58%" stop-color="#b8934f"/>
      <stop offset="78%" stop-color="#e8cd92"/>
      <stop offset="100%" stop-color="#7c5f2c"/>
    </linearGradient>
    <linearGradient id="bead" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#fff5d8"/>
      <stop offset="45%" stop-color="#dcbb78"/>
      <stop offset="100%" stop-color="#8a6a33"/>
    </linearGradient>
    <linearGradient id="floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c8a96a" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#c8a96a" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="haze" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="320" height="380" fill="url(#glow)"/>

  <!-- свет, падающий от украшения вниз -->
  <path d="M160 168 L44 372 H276 Z" fill="url(#floor)" opacity="0.55"/>
  <ellipse cx="160" cy="352" rx="104" ry="14" fill="#c8a96a" opacity="0.16" filter="url(#haze)"/>

  <!-- ореол вокруг кольца -->
  <circle cx="160" cy="158" r="78" fill="#e6c67f" opacity="0.20" filter="url(#soft)"/>

  <!-- кольцо-кликер -->
  <circle cx="160" cy="158" r="70" fill="none" stroke="url(#gold)" stroke-width="13" stroke-linecap="round"/>
  <circle cx="160" cy="158" r="70" fill="none" stroke="#fff3d0" stroke-width="2" opacity="0.5"
          stroke-dasharray="52 388" stroke-dashoffset="96" stroke-linecap="round"/>
  <circle cx="160" cy="88" r="13" fill="url(#bead)"/>
  <circle cx="156" cy="83" r="3.4" fill="#fff8e4" opacity="0.85"/>

  <!-- отражение кольца на поверхности -->
  <ellipse cx="160" cy="344" rx="58" ry="9" fill="none" stroke="#c8a96a" stroke-width="5"
           opacity="0.18" filter="url(#haze)"/>
</svg>
